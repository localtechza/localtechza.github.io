<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocalTech</title>
    <!--
      GitHub Pages has no rewrite rules: it 404s on any path that isn't a real
      file (e.g. /products/laptops). This is the standard spa-github-pages
      workaround — 404.html runs first, shoves the path into the query string
      ("?/products/laptops") and lands on the real index.html, which decodes it
      and hands the clean URL to React Router.

      pathSegmentsToKeep = 0 because the site lives at the domain root
      (see CNAME -> localtechza.co.za).
    -->
    <script>
      (function (l) {
        var pathSegmentsToKeep = 0;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>

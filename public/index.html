<!DOCTYPE html>
<html lang="en">
  <head>
    
    <!--
      Google Analytics. GA only MEASURES visitors; it has no effect on whether
      Google can find the site (that is the router + sitemap.xml).

      To switch it on: put your real G-XXXXXXXXXX id in BOTH places below
      (there is a matching GA_ID in src/config.js). While it still contains
      "XXXX" nothing is loaded and no hits are sent.
    -->
    <script>
      (function () {
        var GA_ID = "G-XXXXXXXXXX";
        if (!GA_ID || GA_ID.indexOf("XXXX") !== -1) return; // not configured yet

        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", GA_ID, { cookie_domain: "auto" });

        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
        document.head.appendChild(s);
      })();
    </script>

    <meta charset="utf-8" />
    <!--
      GitHub Pages serves 404.html for unknown paths, which rewrites the URL to
      "/?/products/laptops". Turn that back into the clean path BEFORE React
      loads, so React Router sees a normal URL and Google sees a real one.
      (Paired with public/404.html — the spa-github-pages technique.)
    -->
    <script>
      (function (l) {
        if (l.search && l.search.charAt(1) === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="LocalTech — desktop PCs, mini PCs, monitors, gaming PCs and PC accessories. PC repairs, upgrades and custom builds by your local tech team."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo4.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link rel="canonical" href="https://localtechza.co.za/" />
    <title>LocalTech | Computers, PC Parts & Tech</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
